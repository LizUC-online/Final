<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final Project Name</title>
  <!-- stylesheets below-->
  <link rel="stylesheet" href="reset.css"><!-- reset everything-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400;1,700&family=Google+Sans+Flex:wght@500&display=swap" rel="stylesheet">
  <!-- fonts here-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><!-- icons-->
  <script src="final.js" defer></script>
  <link rel="stylesheet" href="styles.css"><!-- style sheet-->
</head>
<body>
  <div class="wrapper">
    <header>
      <img src="images/logo.png" alt="Elizabeth's Coffee House Logo">
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="order.html">Order Online</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="reviews.html">Reviews</a></li>
        </ul>
      </nav>
    </header>
    <div class="coffee-image"></div>
    <main>
        <section class="container-2col">
          <section class="column span2 order-box">
            <h2>Order Online</h2>
            <form action="#">
              <label for="drinks">Choose your drink.</label>
              <select name="drinks" id="drinks">
                <option value="menu1">Merry Mocha</option>
                <option value="menu2">Christmas Cinnamon Swirl Latte</option>
                <option value="menu3">Vanilla Snow Swirl Latte</option>
                <option value="menu4">Pumpkin Explosion Latte</option>
                <option value="menu5">Toasted Pecan Cold Brew</option>
                <option value="menu6">Vampire Vanilla Cold Brew</option>
                <option value="menu7">Vanilla Bean Latte</option>
                <option value="menu8">Banana Blast Latte</option>
                <option value="menu9">Blueberry Bread Latte</option>
                <option value="menu10">Brown Sugar Latte</option>
                <option value="menu11">Cozy Chai (HOT)</option>
                <option value="menu12">Classic Matcha (HOT)</option>
                <option value="menu13">Vanilla Matcha</option>
                <option value="menu14">Americano</option>
                <option value="menu15">Decaf</option>
                <option value="menu16">200 Milligrams</option>
                <option value="menu17">Cappuccino</option>
                <option value="menu18">Espresso Shot</option>
              </select>
            </form>
            <form action="#">
              <label for="drinks">What size?</label>
              <select name="drinks" id="drinks">
                <option value="menu1">Small 16oz.</option>
                <option value="menu2">Regular 20oz.</option>
                <option value="menu3">Large 30oz.</option>
              </select>
            </form>
            <p>Put any special requests here.<br>
            <textarea></textarea><br>
            <input type="button" id="add" onclick="addItem()" value="Add Item to Cart"></p>
            <p>Payment Method
              <select name="payment" id="payment">
                <option value="apple">Apple Pay</option>
                <option value="apple">Google Pay</option>
                <option value="apple">Credit Card</option>
              </select>
            </p>
            <form action="order-submitted-page.html"><button class="place-order-btn">Place Your Order</button></form>
          </section>

        </section>
    </main>

    <footer>
      <span class="socials">
        <a href="#">
          <i class="fa-brands fa-instagram"> </i>
        </a>
        <a href="#">
          <i class="fa-brands fa-youtube"> </i>
        </a>
        <a href="#">
          <i class="fa-brands fa-facebook"> </i>
        </a>
      </span>
      <small>Elizabeth's Coffee House 2026</small>
    </footer>
  </div><!-- wrapper div -->

</body>
</html>
